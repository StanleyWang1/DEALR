[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealr-arm"
version = "0.1.0"
description = "Dynamixel interface and controls for the DEALR arm"
requires-python = ">=3.11"
dependencies = [
    "dynamixel-sdk>=3.7.31",
]

[project.scripts]
dealr-bringup = "bringup:main"

[tool.setuptools]
py-modules = ["arm", "bringup", "dynamixel_bus"]
